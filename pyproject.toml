[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "prism-ai-opentelemetry"
version = "0.2.0"
description = "GenAI-convention OpenTelemetry spans from Prism telemetry, for Python."
readme = "README.md"
license = "MIT"
license-files = ["LICENSE"]
requires-python = ">=3.10"
authors = [{ name = "Particle Academy" }]
keywords = ["llm", "agents", "prism", "ai", "opentelemetry", "observability", "tracing"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Typing :: Typed",
]
dependencies = []

[project.optional-dependencies]
dev = ["pytest>=8.0", "mypy>=1.11", "ruff>=0.6"]

[tool.hatch.build.targets.wheel]
packages = ["src/prism_opentelemetry"]

# The source archive carries the package and its licence, and nothing else: not tests,
# CI workflows or contributor notes. Anchored with a leading slash so a pattern cannot
# match a nested file of the same name.
[tool.hatch.build.targets.sdist]
include = ["/src/prism_opentelemetry", "/README.md", "/LICENSE", "/pyproject.toml"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.mypy]
python_version = "3.10"
strict = true
files = ["src", "tests"]
